<script type="module">
  import { store } from "/plugins/custom_providers/webui/custom-provider-store.js";
  // delay to ensure Alpine store registry ready
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => store.init(), { once: true });
  } else {
    // wait a tick for Alpine init
    setTimeout(() => store.init(), 400);
  }
  // also hook initFw_end for SPA navigations
  document.addEventListener("webui-extensions-loaded", () => {
    try { store.refreshList?.(); } catch {}
  });
</script>
